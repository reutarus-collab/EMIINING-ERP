<div id="dashboard-tab" class="tab-content active">
  <label class="dash-outlet"><span>Outlet</span><select id="pos-location" onchange="changePosLocation()" aria-label="Outlet"></select></label>
  <section class="dash-kpis" aria-label="Today's summary" aria-live="polite">
    <button type="button" class="dash-kpi dash-kpi-main" onclick="openDashboardMetric('sales')">
      <span class="dash-kpi-label">Sales today</span>
      <strong id="dash-sales-value">Loading…</strong>
      <small id="dash-sales-count">Checking today’s activity</small>
      <span id="dash-sales-delta" class="dash-delta" hidden></span>
      <svg id="dash-spark" class="dash-spark" viewBox="0 0 120 32" preserveAspectRatio="none" role="img" aria-label="Sales, last 7 days" hidden></svg>
    </button>
    <button type="button" id="dash-credit-card" class="dash-kpi" onclick="openDashboardMetric('credit')">
      <span class="dash-kpi-label">Credit issued</span>
      <strong id="dash-credit-value">—</strong>
      <small id="dash-credit-note">Today</small>
    </button>
    <button type="button" class="dash-kpi" onclick="openDashboardMetric('expenses')">
      <span class="dash-kpi-label">Expenses</span>
      <strong id="dash-expenses-value">—</strong>
      <small>Today</small>
    </button>
    <button type="button" class="dash-kpi" onclick="openDashboardMetric('discounts')">
      <span class="dash-kpi-label">Discounts</span>
      <strong id="dash-discounts-value">—</strong>
      <small>Today</small>
    </button>
  </section>

  <section class="dash-attn" aria-label="Needs attention">
    <h2>Needs attention</h2>
    <div id="dash-attn-list" class="dash-attn-list" aria-live="polite"><p class="dash-attn-empty">Checking…</p></div>
  </section>
  <p id="dash-summary-message" class="dashboard-summary-message" role="status"></p>
</div>
<script>
let dashboardRun = 0;
const DASH_COVER_DAYS = 7;   // an item is flagged when stock covers fewer than this many days of recent sales

async function dashJson(url){
  const r = await fetch(url, {credentials:'same-origin'});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || 'Unavailable');
  return d;
}
function dashMoney(n){ return 'KSh ' + Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function dashSparkline(days){
  const svg = document.getElementById('dash-spark');
  if (!svg) return;
  const values = (days || []).map(d => Number(d.sales) || 0);
  const max = Math.max(...values, 0);
  if (values.length < 2 || max <= 0) { svg.hidden = true; return; }
  const step = 120 / (values.length - 1);
  const pts = values.map((v, i) => [i * step, 30 - (v / max) * 26]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const ns = 'http://www.w3.org/2000/svg';
  svg.replaceChildren();
  const area = document.createElementNS(ns, 'polygon');
  area.setAttribute('class', 'area');
  area.setAttribute('points', '0,32 ' + line + ' 120,32');
  const poly = document.createElementNS(ns, 'polyline');
  poly.setAttribute('points', line);
  svg.append(area, poly);
  svg.setAttribute('aria-label', 'Sales, last 7 days: ' + values.map(v => dashMoney(v)).join(', '));
  svg.hidden = false;
}
function dashAttention(list, tone, title, detail, action){
  const item = document.createElement('button');
  item.type = 'button';
  item.className = 'dash-attn-item is-' + tone;
  const dot = document.createElement('span'); dot.className = 'dash-dot'; dot.setAttribute('aria-hidden', 'true');
  const text = document.createElement('span'); text.className = 'dash-attn-text';
  const strong = document.createElement('strong'); strong.textContent = title;
  text.append(strong);
  if (detail) { const small = document.createElement('small'); small.textContent = detail; text.append(small); }
  const go = document.createElement('span'); go.className = 'dash-attn-go'; go.textContent = 'Open'; go.setAttribute('aria-hidden', 'true');
  item.append(dot, text, go);
  item.addEventListener('click', action);
  list.append(item);
}
async function loadDashboard(){
  const run = ++dashboardRun;
  const role = window.currentRole || '';
  const isOwner = role === 'admin' || role === 'accountant';
  const tab = document.getElementById('dashboard-tab');
  const msg = document.getElementById('dash-summary-message');
  const location = typeof activeLocationId !== 'undefined' ? activeLocationId : '';
  const q = '?location_id=' + encodeURIComponent(location);
  const showsSales = role !== 'warehouse';      // the daily sheet is not open to warehouse users
  tab.classList.toggle('no-sales', !showsSales);

  const [daily, summary, trend, till, stock, customers, payables] = await Promise.allSettled([
    showsSales ? dashJson('/api/reports/daily' + q) : Promise.reject(),
    showsSales ? dashJson('/api/sales-history/summary' + q) : Promise.reject(),
    showsSales ? dashJson('/api/dashboard/trend' + q) : Promise.reject(),
    dashJson('/api/till/current' + q),
    dashJson('/api/stock' + q),
    isOwner ? dashJson('/api/customers' + q) : Promise.reject(),
    isOwner ? dashJson('/api/admin/payables') : Promise.reject(),
  ]);
  if (run !== dashboardRun) return;            // a newer refresh is already running

  // ---- KPIs ----
  if (showsSales) {
    if (daily.status === 'fulfilled') {
      const d = daily.value, sales = Number(d.total_sales) || 0, credit = Number(d.credit_sales) || 0;
      document.getElementById('dash-sales-value').textContent = dashMoney(sales);
      const n = Number(d.sales_count) || 0;
      document.getElementById('dash-sales-count').textContent = n + ' completed sale' + (n === 1 ? '' : 's');
      document.getElementById('dash-discounts-value').textContent = dashMoney(d.discounts);
      document.getElementById('dash-credit-value').textContent = dashMoney(credit);
      document.getElementById('dash-expenses-value').textContent = dashMoney(d.expenses_total);
      const share = sales > 0 ? Math.round(credit / sales * 100) : 0;
      const creditCard = document.getElementById('dash-credit-card');
      creditCard.classList.toggle('is-warn', credit > 0 && share >= 40);
      document.getElementById('dash-credit-note').textContent = credit > 0 && sales > 0 ? share + '% of today’s sales' : 'Today';
      msg.textContent = 'Today’s summary · ' + d.date;
    } else {
      document.getElementById('dash-sales-value').textContent = '—';
      document.getElementById('dash-sales-count').textContent = 'Summary unavailable';
      msg.textContent = (daily.reason && daily.reason.message) || 'Could not load today’s summary.';
    }
    const delta = document.getElementById('dash-sales-delta');
    if (daily.status === 'fulfilled' && summary.status === 'fulfilled' && summary.value.periods && summary.value.periods.yesterday) {
      const y = Number(summary.value.periods.yesterday.gross_sales) || 0, t = Number(daily.value.total_sales) || 0;
      delta.textContent = y > 0 ? Math.round(t / y * 100) + '% of yesterday (' + dashMoney(y) + ')' : 'No sales yesterday';
      delta.hidden = false;
    } else { delta.hidden = true; }
    if (trend.status === 'fulfilled') dashSparkline(trend.value.days); else dashSparkline([]);
  } else {
    msg.textContent = '';
  }

  // ---- Needs attention ----
  const list = document.getElementById('dash-attn-list');
  list.replaceChildren();
  if (till.status === 'fulfilled') {
    const s = till.value.session, hours = till.value.trading_hours || {};
    const goTill = () => { showTab('till-tab'); if (typeof refreshTill === 'function') refreshTill(); if (typeof loadTillMovementHistory === 'function') loadTillMovementHistory(); };
    if (s) dashAttention(list, 'ok', 'Till is open', 'Expected cash ' + dashMoney(s.expected_cash), goTill);
    else dashAttention(list, hours.open_now === false ? 'info' : 'warn', 'Till is closed', hours.open_now === false ? 'Outside trading hours' : 'Open a till before selling', goTill);
  }
  if (stock.status === 'fulfilled' && Array.isArray(stock.value)) {
    const low = stock.value
      .filter(i => Number(i.sold_kg_30d) > 0)
      .map(i => ({name: i.name, days: Number(i.stock_kg) / (Number(i.sold_kg_30d) / 30)}))
      .filter(i => i.days < DASH_COVER_DAYS)
      .sort((a, b) => a.days - b.days);
    const goStock = () => { showTab('stock-tab'); if (typeof loadStock === 'function') loadStock(); };
    if (low.length) {
      const detail = low.slice(0, 3).map(i => i.name + ' · ' + (i.days <= 0 ? 'out' : Math.max(1, Math.floor(i.days)) + 'd left')).join(', ') + (low.length > 3 ? ' +' + (low.length - 3) + ' more' : '');
      dashAttention(list, 'warn', low.length + ' item' + (low.length === 1 ? '' : 's') + ' low on stock', detail, goStock);
    } else {
      dashAttention(list, 'ok', 'Stock levels look fine', 'Every selling item covers ' + DASH_COVER_DAYS + '+ days', goStock);
    }
  }
  if (customers.status === 'fulfilled' && Array.isArray(customers.value)) {
    const owing = customers.value.filter(c => Number(c.balance) > 0).sort((a, b) => b.balance - a.balance);
    if (owing.length) {
      const total = owing.reduce((sum, c) => sum + Number(c.balance), 0);
      dashAttention(list, 'info', dashMoney(total) + ' owed by customers', owing.length + ' customer' + (owing.length === 1 ? '' : 's') + ' · largest ' + owing[0].name + ' ' + dashMoney(owing[0].balance),
        () => { showTab('customers-tab'); if (typeof loadCustAdmin === 'function') loadCustAdmin(); });
    }
  }
  if (payables.status === 'fulfilled' && Number(payables.value.total_owed) > 0) {
    const top = (payables.value.suppliers || []).find(s => Number(s.owed) > 0);
    dashAttention(list, 'info', dashMoney(payables.value.total_owed) + ' owed to suppliers', top ? 'Largest: ' + top.name + ' ' + dashMoney(top.owed) : '',
      () => { showTab('payables-tab'); if (typeof loadPayables === 'function') loadPayables(); });
  }
  if (!list.children.length) {
    const empty = document.createElement('p'); empty.className = 'dash-attn-empty'; empty.textContent = 'Nothing to show right now.'; list.append(empty);
  }
}
function openDashboardMetric(metric){
  if(metric==='sales'){
    if(typeof salesFilter!=='undefined'){salesFilter.period='today';salesFilter.creditOnly=false;}
    const period=document.getElementById('top-period'); if(period) period.value='today';
    showTab('sales-tab'); if(typeof loadTopProducts==='function') loadTopProducts();
  }else if(metric==='credit'){
    if(typeof salesFilter!=='undefined'){salesFilter.period='';salesFilter.creditOnly=true;}
    const period=document.getElementById('top-period'); if(period) period.value='today';
    const credit=document.getElementById('sales-credit-only'); if(credit) credit.checked=true;
    showTab('sales-tab');
  }else if(metric==='discounts'){
    showTab('insights-tab'); if(typeof loadInsights==='function') loadInsights();
  }else if(metric==='expenses'){
    showTab('expenses-tab'); if(typeof loadExpenses==='function') loadExpenses();
  }
}
</script>
