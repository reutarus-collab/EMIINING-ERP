<div id="factory-tab" class="tab-content">
  <div class="card">
    <h3>🏭 Factory Milling & Batch Manufacturing</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div style="background:#f8f9fa; padding:15px; border-radius:6px;">
        <h4>1. Grain Milling Operation</h4>
        <div class="form-group"><label>Input Raw Grain:</label><select id="mill-input-select"></select></div>
        <div class="form-group"><label>Input Weight (KG):</label><input type="number" id="mill-input-qty" placeholder="1000" /></div>
        <div class="form-group"><label>Output Milled Product:</label><select id="mill-output-select"></select></div>
        <button class="btn-primary" onclick="alert('Milling module active.')">Process Milling Run</button>
      </div>
      <div style="background:#f8f9fa; padding:15px; border-radius:6px;">
        <h4>2. Finished Feed Batch Production</h4>
        <div class="form-group"><label>Formula Name:</label><input type="text" id="prod-formula" value="Emining Layers High-Protein" /></div>
        <div class="form-group"><label>Target Finished Feed:</label><select id="prod-output-select"></select></div>
        <button class="btn-success" onclick="alert('Production order queued.')">Execute Production Order</button>
      </div>
    </div>
  </div>
</div>
